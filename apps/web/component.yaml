apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The Astro site (Astro on Cloudflare Workers + Static Assets via @astrojs/cloudflare, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  domain: web
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    # The adapter writes the deployable config beside the Worker it emits:
    # `dist/server/wrangler.json` (no_bundle, main entry.mjs, assets ../client),
    # derived from the committed wrangler.jsonc (name, compatibility, flags).
    wranglerConfig: dist/server/wrangler.json

    # @astrojs/cloudflare (through the Cloudflare Vite plugin) emits the Worker
    # under dist/server and the static output under dist/client — both deploy
    # in one `wrangler deploy` of the generated config.
    workerEntrypoint: dist/server/entry.mjs
    assetsDir: dist/client

    # Per-env worker name: astro-boilerplate-web-{dev,stage,prod}.
    workerName: astro-boilerplate-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@app/web

    # Smoke: the home page renders and carries the app's marker text.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q 'Welcome to'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
