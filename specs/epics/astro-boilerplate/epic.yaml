# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (AB → AB-1, AB-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: astro-boilerplate
  key: AB
spec:
  title: "Vercel's Astro boilerplate on Cloudflare Workers"
  summary: "The Vercel Astro boilerplate — a pre-rendered home page, two server-rendered pages (one setting stale-while-revalidate cache headers) and an optimised-image page — runs on Cloudflare Workers + Static Assets through Astro's own Cloudflare adapter, inside the Cirrus baseline's repository conventions. It is the first non-Next.js port: no OpenNext, the framework's native adapter emits the Worker, and the repository shape (intent, component, checks lane, gated Orun lane) stays the same."
  state: started
  milestones:
    - name: "AB0 — the spec"
      exitCriteria:
        - "the doc set and the task contracts are on main"
      tasks: [AB-1]
    - name: "AB1 — the site on Workers"
      exitCriteria:
        - "apps/web is the upstream boilerplate with @astrojs/cloudflare in place of @astrojs/vercel"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` and `pnpm build` are green on main (Checks)"
        - "`wrangler dev` serves /, /ssr, /ssr-with-swr-caching (with its Cache-Control header) and /image (with the optimised image)"
      tasks: [AB-2]
    - name: "AB2 — ready to instantiate"
      exitCriteria:
        - "the README says how to run, test, preview and deploy it, and what the cache header does on Cloudflare"
        - "the as-built status records every departure from the upstream template"
      tasks: [AB-3]
    - name: "AB3 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new site from nothing to live on stage and prod in three phases"
        - "a site built from it carries the site only, renamed throughout to its own name, repository and Worker"
        - "the stage lane's own steps pass in a job tree staged as orun stages it — the deploy config found before the build, the build, the dry deploy"
        - "Baseline CI is green: contract tests, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier"
      tasks: [AB-4]
    - name: "AB4 — one landing"
      exitCriteria:
        - "repo-blueprint.yaml builds the site in one landing (`01-product`) and records it in a second (`03-docs`); the card's programme names the same two"
        - "a bootstrap landing is checked by `plan` alone: ci.yml skips the lanes and checks.yml its job on `orun/BASE-…` branches"
        - "Baseline CI is green, and a site bootstrapped from the next tag is live faster than baseline-v1's measured 7m07s"
      tasks: [AB-5]
    - name: "AB5 — the cirrus standard"
      exitCriteria:
        - "nothing outside this milestone's own record names kiox: orun is pinned where CI runs it (the orun-action `version:` in each workflow)"
        - "every component carries generated docs/{overview,architecture,runbook}.md, and Baseline CI fails a pull request whose manifests and pages disagree"
        - "ai/context carries this repository's current.md, decisions.md and open-risks.md, and none of them ships to a site"
        - "every milestone's status row agrees with the tags"
        - "the console card reads subdomain from the Cloudflare connection (from: connection.cloudflare.workersSubdomain), as cirrus-baseline since baseline-v23"
      tasks: [AB-6, AB-7]
    - name: "AB6 — the domain is set later"
      exitCriteria:
        - "the console card asks for no domain: a site goes live on workers.dev, and productdomain is an optional build input that defaults to empty"
        - "a site built without a domain is branded with the reserved placeholder <reponame>.example.com wherever the domain goes (BASE_DOMAIN in intent.yaml, the README's SITE_URL example), and its README says how an owner sets the real one"
        - "Baseline CI places, leak-checks and plans a site built with no domain"
      tasks: [AB-8]
